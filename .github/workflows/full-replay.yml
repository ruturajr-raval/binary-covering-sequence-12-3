name: full-replay

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: full-replay-${{ github.ref }}
  cancel-in-progress: false

jobs:
  cpp:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11.9"
      - name: Full C++ replay
        run: make full-replay-cpp PYTHON=python FULL_REPLAY_THREADS=4
      - name: Upload C++ replay log
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: full-replay-cpp
          path: build/full-replay-cpp.jsonl
          if-no-files-found: error

  rust:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11.9"
      - name: Full Rust replay
        run: make full-replay-rust PYTHON=python FULL_REPLAY_THREADS=4
      - name: Upload Rust replay log
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: full-replay-rust
          path: build/full-replay-rust.json
          if-no-files-found: error
