name: full-replay

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: full-replay-${{ github.ref }}
  cancel-in-progress: false

jobs:
  cpp:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11.9"
      - name: Full C++ replay
        run: make full-replay-cpp PYTHON=python FULL_REPLAY_THREADS=4
      - name: Upload C++ replay log
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: full-replay-cpp
          path: build/full-replay-cpp.jsonl
          if-no-files-found: error

  rust:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11.9"
      - name: Full Rust replay
        run: make full-replay-rust PYTHON=python FULL_REPLAY_THREADS=4
      - name: Upload Rust replay log
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: full-replay-rust
          path: build/full-replay-rust.json
          if-no-files-found: error

  release:
    needs:
      - cpp
      - rust
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11.9"
      - name: Install TeX
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            texlive-latex-base texlive-latex-recommended
      - name: Build tagged paper
        run: make paper
      - name: Verify live release tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          live_commit="$(
            gh api \
              "repos/$GITHUB_REPOSITORY/commits/$GITHUB_REF_NAME" \
              --jq .sha
          )"
          test "$live_commit" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Download staged release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ready=false
          for attempt in $(seq 1 30); do
            if python3 tools/build_release_assets.py \
              --check-remote \
              --repo "$GITHUB_REPOSITORY" \
              --ref "$GITHUB_SHA" \
              --tag "$GITHUB_REF_NAME" \
              --remote-state draft \
              >/dev/null 2>&1; then
              ready=true
              break
            fi
            sleep 10
          done
          test "$ready" = "true"
          mkdir -p dist/release
          gh release download "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --dir dist/release
      - name: Verify tag-bound release assets
        run: |
          python3 tools/build_release_assets.py \
            --check \
            --ref "$GITHUB_SHA" \
            --tag "$GITHUB_REF_NAME" \
            --expected-paper build/paper/main.pdf
      - name: Verify remote draft digests
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 tools/build_release_assets.py \
            --check-remote \
            --repo "$GITHUB_REPOSITORY" \
            --ref "$GITHUB_SHA" \
            --tag "$GITHUB_REF_NAME" \
            --remote-state draft \
            --compare-local
      - name: Upload verified release assets
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: binary-covering-sequence-12-3-tagged-release-assets
          path: dist/release
          if-no-files-found: error
          retention-days: 30
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(
            gh api \
              "repos/$GITHUB_REPOSITORY/commits/$GITHUB_REF_NAME" \
              --jq .sha
          )" = "$GITHUB_SHA"
          python3 tools/build_release_assets.py \
            --check-remote \
            --repo "$GITHUB_REPOSITORY" \
            --ref "$GITHUB_SHA" \
            --tag "$GITHUB_REF_NAME" \
            --remote-state draft \
            --compare-local
          gh release edit "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --draft=false \
            --latest \
            --verify-tag
          python3 tools/build_release_assets.py \
            --check-remote \
            --repo "$GITHUB_REPOSITORY" \
            --ref "$GITHUB_SHA" \
            --tag "$GITHUB_REF_NAME" \
            --remote-state published \
            --compare-local \
            --require-immutable
